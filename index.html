<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proposta Offline</title>
<style>
:root{--ink:#14202b;--mut:#6b7c8d;--line:#e2e8ee;--bg:#f1f4f7;--panel:#fff;--deep:#0f1b26;--acc:#2f6fed;--warn:#c4472d;
--PLC:#2f6fed;--Robo:#7c4dde;--Eletrica:#d98e04;--Mecanica:#12957f;
font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
.top{background:var(--deep);color:#fff}
.top .in{max-width:1120px;margin:auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{display:flex;align-items:center;gap:12px}
.logo i{width:34px;height:34px;border-radius:9px;background:conic-gradient(var(--PLC) 0 25%,var(--Robo) 0 50%,var(--Eletrica) 0 75%,var(--Mecanica) 0)}
.logo b{font-size:18px;letter-spacing:.2px}.logo span{display:block;font-size:12px;color:#8fa3b5}
.tabs button{border:0;background:transparent;color:#a9bacb;font:600 13px inherit;padding:9px 16px;border-radius:8px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--deep)}
.wrap{max-width:1120px;margin:auto;padding:20px 20px 70px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px #0f1b260a}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
label{display:grid;gap:5px;font-size:12px;font-weight:600;color:#4d5f70}
input,select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:100%}
input[type=number]{width:84px}input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px;cursor:pointer;background:#e8edf2;color:var(--ink)}
.btn.pri{background:var(--acc);color:#fff}.btn.del{background:#fdeeea;color:var(--warn)}.btn.sm{padding:5px 9px;font-size:12px}
.drop{flex:1;min-width:260px;border:2px dashed #c4cfda;border-radius:12px;padding:14px 16px;background:#f8fafc}
.drop b{display:block;font-size:14px;margin-bottom:6px}
.info{margin-top:12px;padding:10px 12px;border-radius:8px;background:#e8f0ff;font-size:13px}.info.warn{background:#fff3dc}
.hero{display:grid;grid-template-columns:240px 1fr;gap:16px;margin-bottom:16px}
.total{background:var(--deep);color:#fff;border-radius:14px;padding:20px;display:flex;flex-direction:column;justify-content:center}
.total span{font-size:12px;color:#8fa3b5}.total b{font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.total em{font-style:normal;font-size:18px;color:#bcd0e2;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ac{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;padding:12px 14px}
.ac span{font-size:12px;font-weight:700;color:var(--c)}.ac b{display:block;font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
.ac small{color:var(--mut);font-size:12px}
.bar{grid-column:1/-1;display:flex;height:10px;border-radius:6px;overflow:hidden;background:#dde4ea}
.bar i{display:block;background:var(--c)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font:600 12px inherit;cursor:pointer;color:var(--ink)}
.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:7px}
.chip.off{opacity:.45}
.sec{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;margin-bottom:16px;overflow:hidden}
.sec h2{margin:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:baseline;font-size:17px}
.sec h2 b{color:var(--c);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:680px}
th{text-align:left;font-size:11px;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);background:#fafbfc}
td{padding:8px 10px;border-bottom:1px solid #eef2f5;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.off td{color:#a3b0bd}tr.sub td{background:#f6f8fa;font-size:11px;font-weight:700;color:var(--mut)}
.nm{font-weight:600}.ds{color:var(--mut);font-size:12px;margin-top:2px;max-width:520px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px;margin:4px 5px 0 0;background:#e8edf2;color:#4d5f70}
.tag.warn{background:#fdeeea;color:var(--warn)}.tag.ok{background:#e1f5ee;color:#16795f}.tag.new{background:#e3ecff;color:#2459c4}
.hint{font-size:12px;color:var(--mut);margin:8px 0 0}
@media(max-width:820px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
@media print{.no-print{display:none!important}body{background:#fff}.top{background:#fff;color:#000}.card,.sec,.ac{box-shadow:none}}
</style>
</head>
<body>
<div class="top no-print"><div class="in">
  <div class="logo"><i></i><div><b>Proposta Offline</b><span>Horas por área: PLC, Robô, Elétrica e Mecânica</span></div></div>
  <div class="tabs"><button data-a="tab" data-v="p">Proposta</button><button data-a="tab" data-v="c">Cadastro</button></div>
</div></div>
<div class="wrap"><div id="app"></div></div>
<script>
const KEY = "propostaOffline.v3", OTHER = "Outra montadora";
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
const AREAS = ["PLC", "Robô", "Elétrica", "Mecânica"];
const AC = { "PLC": "#2f6fed", "Robô": "#7c4dde", "Elétrica": "#d98e04", "Mecânica": "#12957f" };
const BASE = [
  ["PLC: lógica e intertravamentos do dispositivo", "PLC", 12, 8, "dispositivo,geometria,take in,carga,placa,grupo,grupos"],
  ["PLC: sinais de sensores e fotocélulas", "PLC", 6, 4, "fotocélula,fotocélulas,sensor,sensores,barreira,ventosa"],
  ["PLC: transportador e controle de pallets", "PLC", 16, 12, "transportador,pallet,pallets"],
  ["PLC: troca de modelo", "PLC", 8, 8, "shift,modelo,modelos"],
  ["Robô: programação offline de trajetória", "Robô", 12, 24, "robô,robo,geometria,take in,passamano,nj4"],
  ["Robô: ajuste de programa para nova garra", "Robô", 10, 16, "garra,ventosa,pinça,kit apoio,pisador,console,grupos novos"],
  ["Robô: solda MAG/MIG", "Robô", 16, 40, "mag,mig,arc,tocha,tps"],
  ["Robô: solda ponto", "Robô", 16, 40, "ponto,spot,respot,pinça"],
  ["Robô: medição", "Robô", 8, 16, "medição,medicao"],
  ["Elétrica: sensores e fotocélulas", "Elétrica", 6, 6, "fotocélula,fotocélulas,sensor,sensores,barreira"],
  ["Elétrica: válvulas, ventosas e grupos", "Elétrica", 6, 6, "ventosa,grupo,grupos,válvula,garra,kit apoio"],
  ["Elétrica: painel, cabeamento e remanejamento", "Elétrica", 10, 10, "transportador,desmontagem,transferência,relayout,realocação,base,bracket,extração,iluminação"],
  ["Elétrica: segurança, portões e barreiras", "Elétrica", 6, 6, "portão,barreira,cercamento,grades,cercas"],
  ["Mecânica: dispositivo, placa e apoios", "Mecânica", 10, 10, "dispositivo,placa,apoio,apoios,pisador,geometria,suporte"],
  ["Mecânica: pallet e transportador", "Mecânica", 12, 12, "pallet,pallets,transportador,calços,calço,cercas"],
  ["Mecânica: desmontagem e transferência", "Mecânica", 8, 8, "desmontagem,transferência,transferencia,realocação,montagem"],
  ["Mecânica: mesas, bases e fechamento", "Mecânica", 6, 6, "mesa,base,bracket,portão,grades,cercamento"]
];
const FACT = { "GM": 0.5, "Volkswagen": 0.7, "Fiat": 1, "Jeep": 1, "Stellantis": 1 };
FACT[OTHER] = 1;
const mkActs = f => BASE.map(([n, a, hn, hr, k]) => ({ n, a, hn: Math.round(hn * f), hr, k }));
const seed = () => { const m = {}; for (const k in FACT) m[k] = { acts: mkActs(FACT[k]) }; return { rate: 150, makers: m }; };
const norm = d => { for (const m in d.makers) d.makers[m].acts.forEach(a => { if (!AREAS.includes(a.a)) a.a = "PLC"; if (a.k == null) a.k = ""; }); if (!d.makers[OTHER]) d.makers[OTHER] = { acts: mkActs(1) }; return d; };

let db;
try { db = JSON.parse(localStorage.getItem(KEY)); } catch (e) { db = null; }
db = norm(db && db.makers ? db : seed());
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} };

let view = "p", maker = Object.keys(db.makers)[0], tipo = "nova", sel = {}, parsed = [], rows = [], info = null, cliente = "", hide = {};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = v => { v = parseFloat(String(v).replace(",", ".")); return isNaN(v) || v < 0 ? 0 : v; };
const acts = () => db.makers[maker].acts;
const hrs = a => tipo === "nova" ? a.hn : a.hr;
const fmt = n => n.toLocaleString("pt-BR", { maximumFractionDigits: 1 });
const brl = n => n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const names = () => Object.keys(db.makers).filter(m => m !== OTHER).concat(OTHER);
const tagCls = t => /extra|estudo|discuss/i.test(t) ? "warn" : /reuse/i.test(t) ? "ok" : /novo/i.test(t) ? "new" : "";
const rAct = r => r.act >= 0 ? acts()[r.act] : null;
const rArea = r => rAct(r) ? rAct(r).a : r.area;
const rH = r => rAct(r) ? hrs(rAct(r)) : r.h;
const makerSelect = () => `<label>Montadora<select data-a="maker">${names().map(m => `<option value="${esc(m)}"${m === maker ? " selected" : ""}>${m === OTHER ? "Outra montadora (não listada)" : esc(m)}</option>`).join("")}</select></label>`;
const areaSelect = (v, attrs) => `<select ${attrs}>${AREAS.map(a => `<option${a === v ? " selected" : ""}>${a}</option>`).join("")}</select>`;

function score(a, text) { return (a.k || "").split(",").map(x => x.trim().toLowerCase()).filter(Boolean).filter(w => text.includes(w)).length; }
function rematch() {
  rows = [];
  parsed.forEach((it, p) => {
    const t = (it.head + " " + it.desc).toLowerCase(); let any = false;
    AREAS.forEach(ar => {
      let best = -1, top = 0;
      acts().forEach((a, i) => { if (a.a !== ar) return; const s = score(a, t); if (s > top) { top = s; best = i; } });
      if (best >= 0) { rows.push({ p, act: best, area: ar, h: 0, qty: it.qty, on: true }); any = true; }
    });
    if (!any) rows.push({ p, act: -1, area: "PLC", h: 0, qty: it.qty, on: true });
  });
}

function totals() {
  const by = {}; AREAS.forEach(a => by[a] = 0);
  rows.forEach(r => { if (r.on) by[rArea(r)] += rH(r) * r.qty; });
  acts().forEach((a, i) => { const s = sel[i]; if (s && s.on) by[a.a] += hrs(a) * s.qty; });
  return by;
}

function viewProposta() {
  const by = totals(), total = AREAS.reduce((s, a) => s + by[a], 0);
  const other = maker === OTHER ? `<label>Nome da montadora<input value="${esc(cliente)}" data-a="cliente" placeholder="Ex.: Toyota"></label><button class="btn" data-a="saveMaker">Salvar como nova montadora</button>` : "";
  const setup = `<div class="card"><div class="row">${makerSelect()}${other}
    <label>Tipo de linha<select data-a="tipo"><option value="nova"${tipo === "nova" ? " selected" : ""}>Linha nova</option><option value="reuso"${tipo === "reuso" ? " selected" : ""}>Reuso / retooling</option></select></label>
    <label>Valor da hora (R$)<input type="number" min="0" value="${db.rate}" data-a="rate"></label>
    <div class="drop no-print"><b>Ler escopo de um PDF</b><input type="file" accept="application/pdf" data-a="pdf"></div></div>
    ${maker === OTHER ? `<p class="hint">Montadora não listada usa o cadastro genérico. Ajuste as horas na aba Cadastro ou salve com o nome do cliente.</p>` : ""}
    ${info ? `<div class="info ${info.warn ? "warn" : ""}">${info.html}</div>` : ""}</div>`;
  const hero = `<div class="hero"><div class="total"><span>Total do projeto</span><b>${fmt(total)} h</b><em>${brl(total * db.rate)}</em></div>
    <div class="cards">${AREAS.map(a => `<div class="ac" style="--c:${AC[a]}"><span>${a}</span><b>${fmt(by[a])} h</b><small>${brl(by[a] * db.rate)}${total ? " · " + Math.round(by[a] / total * 100) + "%" : ""}</small></div>`).join("")}
    <div class="bar">${total ? AREAS.map(a => `<i style="--c:${AC[a]};width:${by[a] / total * 100}%"></i>`).join("") : ""}</div></div></div>`;
  const chips = `<div class="chips no-print">${AREAS.map(a => `<button class="chip ${hide[a] ? "off" : ""}" style="--c:${AC[a]}" data-a="toggleArea" data-v="${a}"><i></i>${a}</button>`).join("")}
    <button class="btn sm" data-a="all">Marcar cadastro</button><button class="btn sm" data-a="none">Limpar</button><button class="btn sm pri" data-a="print">Imprimir / PDF</button></div>`;
  const secs = AREAS.filter(a => !hide[a]).map(ar => {
    const pr = rows.map((r, i) => ({ r, i })).filter(x => rArea(x.r) === ar).map(({ r, i }) => {
      const it = parsed[r.p], a = rAct(r), h = rH(r), sub = r.on ? h * r.qty : 0;
      const opts = `<option value="-1">Sem cadastro</option>` + acts().map((x, k) => x.a === ar ? `<option value="${k}"${k === r.act ? " selected" : ""}>${esc(x.n)}</option>` : "").join("");
      const tags = it.tags.map(t => `<span class="tag ${tagCls(t)}">${esc(t)}</span>`).join("") + `<span class="tag">p.${it.pages.join(", ")}</span>`;
      return `<tr class="${r.on ? "" : "off"}"><td><input type="checkbox" data-a="ron" data-i="${i}"${r.on ? " checked" : ""} aria-label="Incluir"></td>
        <td><div class="nm">${esc(it.head)}</div>${it.desc ? `<div class="ds">${esc(it.desc)}</div>` : ""}${tags}</td>
        <td><select data-a="ract" data-i="${i}">${opts}</select>${a ? "" : `<div style="margin-top:6px">${areaSelect(ar, `data-a="rarea" data-i="${i}"`)}</div>`}</td>
        <td class="n">${a ? fmt(h) + " h" : `<input type="number" min="0" value="${r.h}" data-a="rh" data-i="${i}" aria-label="Horas por unidade">`}</td>
        <td class="n"><input type="number" min="0" value="${r.qty}" data-a="rqty" data-i="${i}" aria-label="Quantidade"></td>
        <td class="n">${fmt(sub)} h</td>
        <td class="n no-print">${a ? "" : `<button class="btn sm" data-a="rsave" data-i="${i}">Cadastrar</button> `}<button class="btn sm del" data-a="rdel" data-i="${i}" aria-label="Remover">×</button></td></tr>`;
    }).join("");
    const cr = acts().map((a, i) => ({ a, i })).filter(x => x.a.a === ar).map(({ a, i }) => {
      const s = sel[i] || { on: false, qty: 1 }, sub = s.on ? hrs(a) * s.qty : 0;
      return `<tr class="${s.on ? "" : "off"}"><td><input type="checkbox" data-a="on" data-i="${i}"${s.on ? " checked" : ""} aria-label="Incluir"></td><td colspan="2">${esc(a.n)}</td><td class="n">${fmt(hrs(a))} h</td><td class="n"><input type="number" min="0" value="${s.qty}" data-a="qty" data-i="${i}" aria-label="Quantidade"></td><td class="n">${fmt(sub)} h</td><td></td></tr>`;
    }).join("");
    return `<section class="sec" style="--c:${AC[ar]}"><h2>${ar}<b>${fmt(by[ar])} h · ${brl(by[ar] * db.rate)}</b></h2><div class="scroll"><table>
      <thead><tr><th></th><th>Item</th><th>Atividade</th><th class="n">Horas/un.</th><th class="n">Qtd.</th><th class="n">Subtotal</th><th class="no-print"></th></tr></thead><tbody>
      ${pr}${pr && cr ? `<tr class="sub"><td colspan="7">Outras atividades do cadastro</td></tr>` : ""}${cr || (pr ? "" : `<tr><td colspan="7">Nenhuma atividade cadastrada nesta área.</td></tr>`)}</tbody></table></div></section>`;
  }).join("");
  return setup + hero + chips + secs;
}

function viewCadastro() {
  const rowsH = acts().map((a, i) => `<tr><td>${areaSelect(a.a, `data-a="f" data-k="a" data-i="${i}"`)}</td><td><input value="${esc(a.n)}" data-a="f" data-k="n" data-i="${i}" aria-label="Nome" style="width:100%"></td><td><input value="${esc(a.k || "")}" data-a="f" data-k="k" data-i="${i}" aria-label="Palavras-chave" style="width:100%"></td><td class="n"><input type="number" min="0" value="${a.hn}" data-a="f" data-k="hn" data-i="${i}" aria-label="Horas linha nova"></td><td class="n"><input type="number" min="0" value="${a.hr}" data-a="f" data-k="hr" data-i="${i}" aria-label="Horas reuso"></td><td class="n"><button class="btn del sm" data-a="delAct" data-i="${i}">Remover</button></td></tr>`).join("");
  return `<div class="card"><div class="row">${makerSelect()}<button class="btn pri" data-a="addMaker">Nova montadora</button>${maker === OTHER ? "" : `<button class="btn del" data-a="delMaker">Excluir montadora</button>`}</div></div>
  <div class="card"><div class="scroll"><table><thead><tr><th>Área</th><th>Atividade</th><th>Palavras-chave (vírgula)</th><th class="n">Linha nova (h)</th><th class="n">Reuso (h)</th><th></th></tr></thead><tbody>${rowsH}</tbody></table></div>
  <div class="row" style="margin-top:14px"><button class="btn pri" data-a="addAct">Adicionar atividade</button></div>
  <p class="hint">Ao ler um PDF, cada item recebe a melhor atividade de cada área (PLC, Robô, Elétrica e Mecânica) pelas palavras-chave. Os valores de horas são exemplos: ajuste com os seus.</p></div>
  <div class="card"><div class="row"><button class="btn" data-a="export">Baixar cadastro (.json)</button><label>Carregar cadastro<input type="file" accept=".json,application/json" data-a="import"></label></div>
  <p class="hint">Use o .json como backup ou para levar o cadastro para outro computador.</p></div>`;
}

function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  $("#app").innerHTML = view === "p" ? viewProposta() : viewCadastro();
}

/* ---------- leitura do PDF ---------- */
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  return new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = PDFJS + "pdf.min.js";
    s.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; ok(); };
    s.onerror = () => fail(new Error("cdn"));
    document.head.appendChild(s);
  });
}
function addItem(out, head, desc, qty, kind, page, tags) {
  const key = head + "|" + desc;
  const d = out.find(o => o.key === key && (kind === "ativ" || o.pages.includes(page)));
  if (d) { if (kind === "qty") d.qty += qty; if (!d.pages.includes(page)) d.pages.push(page); tags.forEach(t => { if (!d.tags.includes(t)) d.tags.push(t); }); }
  else out.push({ key, head, desc, qty, kind, pages: [page], tags: tags.slice() });
}
function parseLine(line, page, out) {
  const clean = line.replace(/^[•●▪·\-\s]+/, "");
  const add = (name, qty) => {
    name = name.trim();
    const t = (name.match(/\b(Extra Escopo|Reuse|Novo)\b/i) || [])[1];
    addItem(out, name, "", qty, "qty", page, t ? [t] : []);
  };
  const m = clean.match(/^([A-Z])\s*[–-]\s*(.{8,})$/);
  if (m) { add(m[2], 1); return; }
  if (!/^\d+\s*x\s+/i.test(clean)) return;
  clean.split(/,\s*(?=\d+\s*x\s)/i).forEach(seg => seg.split(/\s\+\s/).forEach(part => {
    const p = part.trim().match(/^(\d+)\s*(x|m)\s*(.+)$/i);
    if (!p) return;
    if (p[2].toLowerCase() === "x") add(p[3], parseInt(p[1], 10)); else add(p[1] + "m " + p[3], 1);
  }));
}
function parseAtiv(lines, page, flags, out) {
  lines.forEach((ln, i) => {
    const m = ln.match(/^Atividades\s+([^:]+):/);
    if (!m) return;
    let txt = "";
    for (let j = i + 1; j < lines.length && j < i + 8; j++) {
      const L = lines[j].replace(/^[•●▪·]\s*/, "").trim();
      if (/^(Data:|Folha|Versão|LAY-OUT)/.test(L)) break;
      txt += (txt ? " " : "") + L;
      if (/;\s*$/.test(L)) break;
    }
    txt = txt.replace(/;\s*$/, "").trim();
    if (!txt) return;
    const head = m[1].trim(), op = (head.match(/Op\d+/) || [])[0];
    addItem(out, head, txt, 1, "ativ", page, (op ? [op] : []).concat(flags));
  });
}
async function readPdf(file) {
  info = { html: "Lendo o PDF…" }; render();
  try { await loadPdfJs(); } catch (e) { info = { warn: 1, html: "Não foi possível carregar a leitura de PDF. Na primeira vez é preciso estar conectado à internet." }; render(); return; }
  try {
    const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
    let all = "", found = [];
    for (let p = 1; p <= pdf.numPages; p++) {
      const tc = await (await pdf.getPage(p)).getTextContent(), rws = [];
      tc.items.forEach(it => {
        if (!it.str.trim()) return;
        const y = Math.round(it.transform[5]);
        let r = rws.find(r => Math.abs(r.y - y) <= 3);
        if (!r) { r = { y, t: [] }; rws.push(r); }
        r.t.push({ x: it.transform[4], s: it.str });
      });
      const lines = rws.sort((a, b) => b.y - a.y).map(r => r.t.sort((a, b) => a.x - b.x).map(t => t.s).join(" ").replace(/\s+/g, " ").trim());
      const pt = lines.join("").replace(/\s+/g, "").toLowerCase(), flags = [];
      if (pt.includes("emfasedeestudo")) flags.push("Em estudo");
      if (/n[ãa]oest[áa]aceitando/.test(pt)) flags.push("Em discussão");
      all += lines.join("\n") + "\n";
      lines.forEach(l => parseLine(l, p, found));
      parseAtiv(lines, p, flags, found);
    }
    if (all.replace(/\s/g, "").length < 50) { info = { warn: 1, html: "Este PDF não tem texto selecionável (parece escaneado), então não consigo ler os itens." }; parsed = []; rows = []; render(); return; }
    const alias = { Volkswagen: "volks|vw", GM: "general motors" };
    const hit = names().filter(n => n !== OTHER).find(n => new RegExp("\\b(" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + (alias[n] ? "|" + alias[n] : "") + ")\\b", "i").test(all));
    maker = hit || OTHER; sel = {};
    tipo = /reus|retool|realoca|transfer/i.test(all) ? "reuso" : "nova";
    parsed = found; rematch();
    const semAct = rows.filter(r => r.act < 0).length;
    info = { warn: !hit || !parsed.length, html: `PDF lido: <b>${parsed.length}</b> itens, divididos em <b>${rows.length}</b> linhas por área. Montadora: <b>${hit ? esc(hit) : "não reconhecida (usando Outra montadora)"}</b>. Tipo de linha sugerido: <b>${tipo === "reuso" ? "reuso / retooling" : "linha nova"}</b>. ${semAct ? semAct + " item(ns) sem atividade no cadastro." : ""} Confira e corrija se precisar.` };
  } catch (e) { info = { warn: 1, html: "Erro ao ler o PDF. Tente outro arquivo." }; }
  render();
}

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-a]");
  if (!t) return;
  const a = t.dataset.a, i = +t.dataset.i;
  if (a === "tab") view = t.dataset.v;
  else if (a === "toggleArea") hide[t.dataset.v] = !hide[t.dataset.v];
  else if (a === "all") acts().forEach((_, k) => sel[k] = { on: true, qty: (sel[k] || {}).qty || 1 });
  else if (a === "none") { sel = {}; rows.forEach(r => r.on = false); }
  else if (a === "print") { window.print(); return; }
  else if (a === "addMaker") {
    const n = (prompt("Nome da nova montadora:") || "").trim();
    if (!n || db.makers[n]) return;
    db.makers[n] = { acts: JSON.parse(JSON.stringify(db.makers[OTHER].acts)) }; maker = n; sel = {}; rematch(); save();
  }
  else if (a === "saveMaker") {
    const n = cliente.trim();
    if (!n || db.makers[n]) { alert(n ? "Essa montadora já existe." : "Digite o nome da montadora."); return; }
    db.makers[n] = { acts: JSON.parse(JSON.stringify(db.makers[OTHER].acts)) }; maker = n; sel = {}; cliente = ""; rematch(); save();
  }
  else if (a === "delMaker") {
    if (!confirm("Excluir " + maker + " e todas as suas atividades?")) return;
    delete db.makers[maker]; maker = names()[0]; sel = {}; rematch(); save();
  }
  else if (a === "addAct") { acts().push({ n: "Nova atividade", a: "PLC", hn: 0, hr: 0, k: "" }); save(); }
  else if (a === "delAct") { acts().splice(i, 1); sel = {}; rematch(); save(); }
  else if (a === "rdel") rows.splice(i, 1);
  else if (a === "rsave") {
    const r = rows[i], it = parsed[r.p], n = (it.head.length > 60 ? it.head.slice(0, 60) : it.head).replace(/\b(Extra Escopo|Reuse|Novo)\b/gi, "").replace(/\s+/g, " ").trim();
    acts().push({ n: rArea(r) + ": " + n, a: rArea(r), hn: r.h, hr: r.h, k: n.toLowerCase() }); r.act = acts().length - 1; save();
  }
  else if (a === "export") {
    const url = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: "application/json" }));
    const l = document.createElement("a"); l.href = url; l.download = "cadastro-proposta-offline.json"; l.click(); URL.revokeObjectURL(url); return;
  }
  else return;
  render();
});

document.addEventListener("change", e => {
  const t = e.target, a = t.dataset.a, i = +t.dataset.i;
  if (!a) return;
  if (a === "maker") { maker = t.value; sel = {}; rematch(); }
  else if (a === "tipo") tipo = t.value;
  else if (a === "rate") { db.rate = num(t.value); save(); }
  else if (a === "cliente") { cliente = t.value; return; }
  else if (a === "on") sel[i] = { on: t.checked, qty: (sel[i] || {}).qty || 1 };
  else if (a === "qty") sel[i] = { on: (sel[i] || {}).on || false, qty: num(t.value) };
  else if (a === "ron") rows[i].on = t.checked;
  else if (a === "rqty") rows[i].qty = num(t.value);
  else if (a === "rh") rows[i].h = num(t.value);
  else if (a === "rarea") rows[i].area = t.value;
  else if (a === "ract") { const r = rows[i]; r.area = rArea(r); r.act = +t.value; }
  else if (a === "pdf") { if (t.files[0]) readPdf(t.files[0]); return; }
  else if (a === "f") {
    const k = t.dataset.k;
    acts()[i][k] = (k === "n" || k === "k" || k === "a") ? t.value : num(t.value);
    save(); if (k === "a") render(); return;
  }
  else if (a === "import") {
    const f = t.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d.makers || typeof d.makers !== "object") throw 0;
        db = norm(d); maker = names()[0]; sel = {}; parsed = []; rows = []; save(); render();
      } catch (x) { alert("Arquivo inválido. Use um .json baixado desta página."); }
    };
    r.readAsText(f); return;
  }
  render();
});

render();
</script>
